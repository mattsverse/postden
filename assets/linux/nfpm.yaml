# The .deb and .rpm packages, built by scripts/package.sh. It sets VERSION and NFPM_ARCH
# (amd64 or arm64) and stages the binary at target/package/linux/postden.
name: postden
version: ${VERSION}
arch: ${NFPM_ARCH}
platform: linux
section: mail
priority: optional
maintainer: Matteo Gassend <mgassend@gmail.com>
description: Local, privacy-focused, no-frills email
homepage: https://github.com/mattsverse/postden
license: MIT

contents:
  - src: target/package/linux/postden
    dst: /usr/bin/postden
    file_info:
      mode: 0755
  # The file name matches the app id the window reports, so desktops pair the window with it.
  - src: assets/linux/com.matteogassend.postden.desktop
    dst: /usr/share/applications/com.matteogassend.postden.desktop
    file_info:
      mode: 0644
  # The icon the .desktop file's Icon= names; scripts/icons.sh renders the PNGs from the SVG.
  - src: assets/icon/postden.svg
    dst: /usr/share/icons/hicolor/scalable/apps/com.matteogassend.postden.svg
    file_info:
      mode: 0644
  - src: assets/linux/icons/32.png
    dst: /usr/share/icons/hicolor/32x32/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: assets/linux/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: assets/linux/icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: assets/linux/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: assets/linux/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: assets/linux/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/com.matteogassend.postden.png
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/postden/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/postden/LICENSE
    file_info:
      mode: 0644

# Linked: glibc and libxkbcommon. Loaded at run time: Vulkan (the only Linux GPU backend), xcb,
# fontconfig, and a Secret Service (such as GNOME Keyring) for passwords.
overrides:
  deb:
    depends:
      - libc6
      - libxkbcommon0
      - libvulkan1
      - libxcb1
      - libfontconfig1
    recommends:
      - mesa-vulkan-drivers
      - gnome-keyring
  rpm:
    depends:
      - glibc
      - libxkbcommon
      - vulkan-loader
      - libxcb
      - fontconfig
    recommends:
      - mesa-vulkan-drivers
      - gnome-keyring

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks on main with the queued PRs on top, so a PR that passed
  # against an older main can't merge broken.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Toolchains come from mise.toml; fail if mise.lock doesn't pin them.
  MISE_LOCKED: "1"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-system-deps
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.6
          # Only what this job runs: rust everywhere, plus python for the release helpers (Linux)
          # and the bundle's Info.plist (macOS). The hooks' tools and the website's bun stay local.
          install_args: ${{ runner.os == 'Windows' && 'rust' || 'rust python' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check release helpers
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release.py check-config
          bash -n scripts/*.sh
      # An unoptimized bundle: it reuses the test build, while still checking the script, the
      # Info.plist and the signing. The release-profile build runs on main (bundle job) and in
      # the release workflow.
      - name: Build app bundle
        if: runner.os == 'macOS'
        run: |
          plutil -lint assets/macos/Info.plist
          bash scripts/bundle-macos.sh --dev

  bundle:
    name: bundle (release, macos-15)
    # Post-merge only, not in PRs or the merge queue: a release-only build failure is rare, and
    # the release workflow builds the same thing before publishing. Its own job keeps release
    # artifacts out of the PR caches.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.6
          install_args: rust python
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build app bundle
        run: bash scripts/bundle-macos.sh

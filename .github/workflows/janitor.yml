# Generated by Janitor. Regenerate this workflow after changing `version` in janitor.toml.
name: Janitor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  id-token: write # lets tailscale/github-action request a GitHub OIDC token

concurrency:
  group: janitor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets and write tokens are intentionally unavailable to pull requests from forks.
    # Dependabot PRs only receive Dependabot secrets, so skip them too (re-add after regenerating).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JANITOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.JANITOR_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.TS_PROXY_HOST }}
      - name: Review pull request
        run: npx --yes "@matfire/janitor@latest" review
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          JANITOR_VERBOSE: ${{ vars.JANITOR_VERBOSE }}
          JANITOR_QUIET: ${{ vars.JANITOR_QUIET }}
          JANITOR_MODEL: ${{ secrets.JANITOR_MODEL }}
          JANITOR_PROVIDER: ${{ secrets.JANITOR_PROVIDER }}
          JANITOR_PROVIDER_KEY: ${{ secrets.JANITOR_PROVIDER_KEY }}
          JANITOR_BASE_URL: ${{ secrets.JANITOR_BASE_URL }}
